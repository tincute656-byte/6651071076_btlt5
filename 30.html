<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insert row in a table - w3resource</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 16px;
    background: linear-gradient(135deg, #e0f2f1, #e8eaf6);
    font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #1f2d3d;
  }
  .card {
    max-width: 640px; margin: 0 auto; padding: 28px;
    background: #fff; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(31, 45, 61, .12);
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  p.sub { margin: 0 0 20px; color: #6b7a89; font-size: .95rem; }

  table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 10px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e3e9ef; }
  th { background: #00796b; color: #fff; font-weight: 600; }
  tbody tr:nth-child(even) { background: #f4f8f8; }
  tbody tr:hover { background: #e0f2f1; }
  tr.new { animation: flash .9s ease; }
  @keyframes flash { from { background: #ffe082; } to { background: transparent; } }

  .actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=button] {
    padding: 10px 22px; border: 0; border-radius: 8px; cursor: pointer;
    font: 600 1rem inherit; font-family: inherit;
    background: #00796b; color: #fff; transition: transform .1s, background .2s;
  }
  input[type=button]:hover { background: #00695c; }
  input[type=button]:active { transform: scale(.97); }
  input[type=button]:focus-visible { outline: 3px solid #80cbc4; outline-offset: 2px; }
  #count { color: #6b7a89; font-size: .9rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Thêm hàng vào bảng bằng DOM</h1>
  <p class="sub">Nhấn nút "Insert row" để thêm một hàng mới vào cuối bảng.</p>

  <table id="sampleTable" border="1">
    <thead><tr><th>Cột 1</th><th>Cột 2</th></tr></thead>
    <tbody>
      <tr><td>Row1 cell1</td>
      <td>Row1 cell2</td></tr>
      <tr><td>Row2 cell1</td>
      <td>Row2 cell2</td></tr>
    </tbody>
  </table>

  <div class="actions">
    <input type="button" onclick="insert_Row()" value="Insert row">
    <span id="count">Số hàng dữ liệu: 2</span>
  </div>
</div>

<script>
function insert_Row() {
  var table = document.getElementById('sampleTable');
  var tbody = table.tBodies[0];

  // Thêm hàng vào cuối tbody (bỏ qua hàng tiêu đề)
  var row = tbody.insertRow(tbody.rows.length);
  var cell1 = row.insertCell(0);
  var cell2 = row.insertCell(1);

  var n = tbody.rows.length;
  cell1.innerHTML = 'Row' + n + ' cell1';
  cell2.innerHTML = 'Row' + n + ' cell2';

  row.className = 'new';
  document.getElementById('count').textContent = 'Số hàng dữ liệu: ' + n;
}
</script>
</body>
</html>
