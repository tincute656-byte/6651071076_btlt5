<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Return first and last name from a form</title>
</head>
<body>
<form id="form1" onsubmit="return getFormvalue()">
First name: <input type="text" name="fname" value="David"><br>
Last name: <input type="text" name="lname" value="Beckham"><br>
<input type="submit" value="Submit">
</form>

<p id="result"></p>

<script>
function getFormvalue() {
  var form = document.getElementById('form1');

  // Cách 1: truy cập qua thuộc tính name của input
  var fname = form.elements['fname'].value;
  var lname = form.elements['lname'].value;

  // Cách 2 (tương đương): form.fname.value, form.lname.value
  // Cách 3 (tương đương): form.elements[0].value, form.elements[1].value

  alert('Họ: ' + lname + '\nTên: ' + fname);
  document.getElementById('result').innerHTML =
    'First name: ' + fname + '<br>Last name: ' + lname;

  return false; // chặn form tải lại trang để thấy kết quả
}
</script>
</body>
</html>
