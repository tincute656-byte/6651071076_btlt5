<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 25 - Tính tiền thực đơn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        .menu-wrapper {
            width: 450px;
            margin: 0 auto;
        }

        /* Bảng Thực Đơn (Bảng trên) */
        .menu-table {
            width: 100%;
            background-color: #c0ff00; /* Màu nền xanh đốm/chuối */
            border: 2px solid #008000;
            border-collapse: collapse;
        }

        .menu-table td, .menu-table th {
            padding: 8px;
            vertical-align: top;
        }

        .main-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 0;
        }

        .sub-header {
            color: #0000cc;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        select {
            width: 130px;
            font-size: 14px;
            border: 1px solid #888;
        }

        .radio-group {
            font-weight: bold;
            font-size: 15px;
            line-height: 2.5;
        }

        .btn-container {
            text-align: center;
            padding: 10px 0;
        }

        .btn-calc {
            border-radius: 12px;
            padding: 3px 15px;
            background-color: #e0e0e0;
            border: 1px solid #777;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Bảng Kết Quả (Bảng dưới) */
        .result-table {
            width: 100%;
            margin-top: 5px;
            background-color: #a6ffff; /* Màu nền xanh băng/cyan */
            border: 2px solid #008000;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 2px solid #008000;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .result-table th {
            color: #0000cc;
            text-align: center;
        }

        .result-table td:nth-child(2) {
            width: 35%;
        }
    </style>
</head>
<body>

<div class="menu-wrapper">
    <!-- BẢNG BẮT ĐẦU: THỰC ĐƠN -->
    <table class="menu-table">
        <tr>
            <td colspan="3" class="main-title">THỰC ĐƠN</td>
        </tr>
        <tr class="sub-header">
            <th style="width: 35%;">Thức ăn</th>
            <th style="width: 35%;">Nước uống</th>
            <th style="width: 30%;">Thời điểm</th>
        </tr>
        <tr>
            <td align="center">
                <!-- Giữ Ctrl / Cmd để chọn nhiều món -->
                <select id="thucAn" multiple size="7">
                    <option value="20000">Bún bò</option>
                    <option value="18000">Hủ tiếu</option>
                    <option value="17000">Bánh canh</option>
                    <option value="19000">Phở bò</option>
                    <option value="15000">Nuôi</option>
                    <option value="12000">Bánh mì thịt</option>
                    <option value="15000">Bánh cuốn</option>
                </select>
            </td>
            <td align="center">
                <select id="nuocUong" multiple size="7">
                    <option value="12000">Cà phê đá</option>
                    <option value="15000">Cà phê sữa đá</option>
                    <option value="13000">Chanh dây</option>
                    <option value="12000">Chanh muối</option>
                    <option value="14000">Xí muội</option>
                    <option value="13000">Sữa tươi</option>
                    <option value="17000">Cam vắt</option>
                </select>
            </td>
            <td class="radio-group">
                <label><input type="radio" name="thoiDiem" value="day" checked> Ban ngày</label><br>
                <label><input type="radio" name="thoiDiem" value="night"> Ban đêm</label>
            </td>
        </tr>
        <tr>
            <td colspan="3" class="btn-container">
                <button type="button" class="btn-calc" onclick="tinhTien()">Tính tiền</button>
            </td>
        </tr>
    </table>

    <!-- BẢNG KẾT QUẢ XUẤT HÓA ĐƠN -->
    <table class="result-table" id="resultTable" style="display: none;">
        <thead>
            <tr>
                <th>Các món đã dùng</th>
                <th>Tiền</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <!-- Danh sách món ăn/nước uống sẽ tự động chèn vào đây -->
        </tbody>
        <tfoot>
            <tr>
                <td style="color: #0000cc;">Tổng tiền</td>
                <td id="totalCell"></td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
    function tinhTien() {
        const selectThucAn = document.getElementById("thucAn");
        const selectNuocUong = document.getElementById("nuocUong");
        const isNight = document.querySelector('input[name="thoiDiem"]:checked').value === "night";

        const resultTable = document.getElementById("resultTable");
        const resultBody = document.getElementById("resultBody");
        const totalCell = document.getElementById("totalCell");

        // Xóa kết quả tính cũ
        resultBody.innerHTML = "";
        let tongTien = 0;

        // 1. Duyệt danh sách THỨC ĂN được chọn
        for (let option of selectThucAn.selectedOptions) {
            const tenMon = option.text;
            const gia = parseInt(option.value);
            tongTien += gia;

            const row = `<tr><td>${tenMon}</td><td>${gia}</td></tr>`;
            resultBody.innerHTML += row;
        }

        // 2. Duyệt danh sách NƯỚC UỐNG được chọn
        for (let option of selectNuocUong.selectedOptions) {
            const tenMon = option.text;
            const gia = parseInt(option.value);
            tongTien += gia;

            const row = `<tr><td>${tenMon}</td><td>${gia}</td></tr>`;
            resultBody.innerHTML += row;
        }

        // 3. Kiểm tra phụ thu Ban đêm (+10%)
        if (isNight) {
            tongTien = tongTien * 1.1;
        }

        // 4. Cập nhật Tổng tiền và hiển thị bảng kết quả
        totalCell.innerText = `${tongTien} đồng`;
        resultTable.style.display = "table";
    }
</script>

</body>
</html>
